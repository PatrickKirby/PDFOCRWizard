[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]  # `l` for a line is used throughout; renaming risks a
                    # typo in untested pixel/OCR code for no functional gain
